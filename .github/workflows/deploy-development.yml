name: Deploy Development

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  infrastructure:
    name: Infrastructure
    uses: ./.github/workflows/infrastructure.yml
    with:
      environment: dev
      resource_group: rg-azure-chatbot-dev
      parameters_file: infrastructure/parameters.dev.json
    secrets: inherit

  backend:
    name: Backend
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy Backend
        uses: ./.github/actions/deploy-backend
        with:
          resource_group: rg-azure-chatbot-dev
          container_app_name: ${{ needs.infrastructure.outputs.container_app_name }}
          acr_name: ${{ needs.infrastructure.outputs.acr_name }}

  frontend:
    name: Frontend
    needs: [infrastructure, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy Frontend
        uses: ./.github/actions/deploy-frontend
        with:
          resource_group: rg-azure-chatbot-dev
          static_web_app_name: ${{ needs.infrastructure.outputs.static_web_app_name }}
          azure_client_id: ${{ secrets.SPA_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          frontend_url: ${{ needs.infrastructure.outputs.frontend_url }}
          backend_url: ${{ needs.infrastructure.outputs.backend_url }}
          backend_client_id: ${{ secrets.BACKEND_CLIENT_ID }}
          environment: dev

      - name: Update Redirect URI
        uses: ./.github/actions/update-redirect-uri
        with:
          app_client_id: ${{ secrets.SPA_CLIENT_ID }}
          redirect_uri: ${{ needs.infrastructure.outputs.frontend_url }}
