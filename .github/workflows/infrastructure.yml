name: Infrastructure Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      resource_group:
        description: 'Azure resource group name'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: false
        type: string
        default: 'eastus2'
      parameters_file:
        description: 'Bicep parameters file path (leave empty to auto-generate)'
        required: false
        type: string
        default: ''
    outputs:
      frontend_url:
        description: 'Frontend URL'
        value: ${{ jobs.deploy.outputs.frontend_url }}
      backend_url:
        description: 'Backend URL'
        value: ${{ jobs.deploy.outputs.backend_url }}
      container_app_name:
        description: 'Container App name'
        value: ${{ jobs.deploy.outputs.container_app_name }}
      acr_name:
        description: 'ACR name'
        value: ${{ jobs.deploy.outputs.acr_name }}
      static_web_app_name:
        description: 'Static Web App name'
        value: ${{ jobs.deploy.outputs.static_web_app_name }}

jobs:
  deploy:
    name: Deploy Infrastructure (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      frontend_url: ${{ steps.infra.outputs.frontend_url }}
      backend_url: ${{ steps.infra.outputs.backend_url }}
      container_app_name: ${{ steps.infra.outputs.container_app_name }}
      acr_name: ${{ steps.infra.outputs.acr_name }}
      static_web_app_name: ${{ steps.infra.outputs.static_web_app_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy Infrastructure
        id: infra
        uses: ./.github/actions/deploy-infrastructure
        with:
          environment: ${{ inputs.environment }}
          resource_group: ${{ inputs.resource_group }}
          location: ${{ inputs.location }}
          parameters_file: ${{ inputs.parameters_file }}
