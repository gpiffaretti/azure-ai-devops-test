name: Deploy Frontend
description: Build and deploy frontend to Azure Static Web Apps

inputs:
  resource_group:
    description: 'Azure resource group name'
    required: true
  static_web_app_name:
    description: 'Static Web App name'
    required: true
  backend_url:
    description: 'Backend API URL'
    required: true
  environment:
    description: 'Deployment environment'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Build Frontend
      shell: bash
      working-directory: frontend
      env:
        REACT_APP_API_BASE_URL: ${{ inputs.backend_url }}
      run: npm run build

    - name: Get SWA Deployment Token
      id: swa-token
      shell: bash
      run: |
        TOKEN=$(az staticwebapp secrets list \
          --name "${{ inputs.static_web_app_name }}" \
          --resource-group "${{ inputs.resource_group }}" \
          --query "properties.apiKey" -o tsv)
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> $GITHUB_OUTPUT

    - name: Deploy to Static Web App
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
        repo_token: ${{ github.token }}
        action: upload
        app_location: frontend/build
        skip_app_build: true
